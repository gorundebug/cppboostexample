services:
  cpp-build:
    image: orderservice-cpp-build
    build:
      context: .
      dockerfile: Dockerfile.cmake
      # The project Dockerfile also contains runtime stages for every service.
      # A packaged service only needs the shared development toolchain here;
      # selecting it explicitly keeps an independent build independent.
      target: development
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        SERVICEGEN_GITHUB_RAW_URL: ${SERVICEGEN_GITHUB_RAW_URL:-}
        SERVICEGEN_CONAN_REMOTE_URL: ${SERVICEGEN_CONAN_REMOTE_URL:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
        SERVICEGEN_APT_UBUNTU_ARCHIVE_URL: ${SERVICEGEN_APT_UBUNTU_ARCHIVE_URL:-}
        SERVICEGEN_APT_UBUNTU_SECURITY_URL: ${SERVICEGEN_APT_UBUNTU_SECURITY_URL:-}
        SERVICEGEN_APT_UBUNTU_PORTS_URL: ${SERVICEGEN_APT_UBUNTU_PORTS_URL:-}
      additional_contexts:
        servicelib-source: ${SERVICELIB_SOURCE_CONTEXT:-https://github.com/gorundebug/cppboostservicelib.git#v0.2.13}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    working_dir: /workspace
    environment:
      CPPBOOSTSERVICELIB_SOURCE_DIR: ${SERVICELIB_CONTAINER_SOURCE_DIR:-/opt/servicelib}
      SERVICELIB_SOURCE_DIR: ${SERVICELIB_CONTAINER_SOURCE_DIR:-/opt/servicelib}
      CCACHE_DIR: /ccache
      CCACHE_BASEDIR: /workspace
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: ${CCACHE_MAXSIZE:-20G}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GIT_CONFIG_COUNT: ${GIT_CONFIG_COUNT:-0}
      GIT_CONFIG_KEY_0: ${GIT_CONFIG_KEY_0:-}
      GIT_CONFIG_VALUE_0: ${GIT_CONFIG_VALUE_0:-}
      GIT_CONFIG_KEY_1: ${GIT_CONFIG_KEY_1:-}
      GIT_CONFIG_VALUE_1: ${GIT_CONFIG_VALUE_1:-}
      SERVICEGEN_FETCH_CPP_DEPENDENCIES: ${SERVICEGEN_FETCH_CPP_DEPENDENCIES:-OFF}
      SERVICEGEN_CONAN_REMOTE_URL: ${SERVICEGEN_CONAN_REMOTE_URL:-}
      SERVICEGEN_GITHUB_RAW_URL: ${SERVICEGEN_GITHUB_RAW_URL:-}
      CONAN_HOME: /conan
    volumes:
      - .:/workspace
      - cpp-cmake-build:/workspace/build
      - cpp-ccache:/ccache
      - ${SERVICEGEN_CONAN_HOME:-cpp-conan2}:/conan
    command:
      - /bin/bash
      - -lc
      - source scripts/configure-git-auth.generated.sh && ./scripts/conan-install.generated.sh Debug /workspace/build/conan-debug && conan_toolchain="$$(cat /workspace/build/conan-debug/toolchain.path)" && cmake --fresh --preset docker-debug -DCMAKE_TOOLCHAIN_FILE="$$conan_toolchain" -DSERVICEGEN_FETCH_CPP_DEPENDENCIES=OFF && cmake --build --preset docker-debug --parallel && ctest --preset docker-debug

volumes:
  cpp-cmake-build:
  cpp-ccache:
  cpp-conan2: