services:
  analyticsservice:
    image: analyticsservice-cpp-build
    working_dir: /workspace/source
    command:
      - /bin/sh
      - -c
      - |
        if [ "$${DEBUG:-0}" = "1" ]; then
          exec gdbserver :2345 /workspace/build/example_analytics_service --config /workspace/source/config/config.yaml --values /workspace/source/config/overrides.integration.generated.yaml
        fi
        exec /workspace/build/example_analytics_service --config /workspace/source/config/config.yaml --values /workspace/source/config/overrides.integration.generated.yaml
    volumes:
      - .:/workspace/source:ro
      - cpp-dev-cmake-build:/workspace/build
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_PTRACE

volumes:
  cpp-dev-cmake-build:
    name: ${CPPBOOST_BUILD_VOLUME:-cppboostexample_cpp-cmake-build-v0.2.24}