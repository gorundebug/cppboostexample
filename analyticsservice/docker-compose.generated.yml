services:
  analyticsservice:
    image: analyticsservice-cpp-build
    working_dir: /workspace
    command:
      - /workspace/build/example_analytics_service
      - --config
      - /workspace/config/config.yaml
      - --values
      - /workspace/config/overrides.integration.generated.yaml
    volumes:
      - .:/workspace
      - cpp-cmake-build:/workspace/build
    stop_grace_period: 30000ms
    restart: unless-stopped
    environment:
      - DEBUG=${ANALYTICS_SERVICE_DEBUG:-0}
    ports:
      - "9093:9093"
      - "9203:9203"
      - "2345:2345"
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_PTRACE

volumes:
  cpp-cmake-build: