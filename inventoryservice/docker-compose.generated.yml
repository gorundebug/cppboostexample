services:
  inventoryservice:
    image: cppboostexample-inventoryservice
    working_dir: /app
    command:
      - --config
      - /app/config/config.yaml
      - --values
      - /app/config/overrides.integration.generated.yaml
    stop_grace_period: 30000ms
    restart: unless-stopped
    environment:
      - DEBUG=${DEBUG:-0}
    ports:
      - "9092:9092"
      - "9202:9202"
      - "2345:2345"