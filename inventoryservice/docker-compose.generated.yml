services:
  inventoryservice:
    image: cppboostexample-inventoryservice
    working_dir: /app
    command:
      - --config
      - /app/config/config.yaml
      - --values
      - /app/config/overrides.integration.generated.yaml
    stop_grace_period: 30000ms
    restart: unless-stopped
    environment:
      - DEBUG=${DEBUG:-0}
      - INVENTORY_SERVICE_HTTP_PORT
      - INVENTORY_SERVICE_GRPC_PORT
    ports:
      - "${INVENTORY_SERVICE_HTTP_PORT:-9092}:${INVENTORY_SERVICE_HTTP_PORT:-9092}"
      - "${INVENTORY_SERVICE_GRPC_PORT:-9202}:${INVENTORY_SERVICE_GRPC_PORT:-9202}"
      - "2345:2345"