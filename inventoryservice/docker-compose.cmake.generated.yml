services:
  cpp-check:
    extends:
      service: inventoryservice-runtime
    image: cppboostexample-inventoryservice-check:local
    build:
      target: debug-builder

  cpp-test:
    extends:
      service: inventoryservice-runtime
    image: cppboostexample-inventoryservice-test:local
    build:
      target: test-builder

  cpp-build:
    image: inventoryservice-cpp-build:local
    build:
      context: .
      dockerfile: Dockerfile
      target: source-builder
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        DEPENDENCY_DOCKER_REGISTRY: ${DEPENDENCY_DOCKER_REGISTRY:-docker.io}
        DEPENDENCY_GITHUB_RAW_URL: ${DEPENDENCY_GITHUB_RAW_URL:-}
        DEPENDENCY_CONAN_REMOTE_URL: ${DEPENDENCY_CONAN_REMOTE_URL:-}
        DEPENDENCY_CONAN_UPLOAD_URL: ${DEPENDENCY_CONAN_UPLOAD_URL:-}
        DEPENDENCY_CONAN_PUBLISH: ${DEPENDENCY_CONAN_PUBLISH:-0}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
        DEPENDENCY_APT_UBUNTU_ARCHIVE_URL: ${DEPENDENCY_APT_UBUNTU_ARCHIVE_URL:-}
        DEPENDENCY_APT_UBUNTU_SECURITY_URL: ${DEPENDENCY_APT_UBUNTU_SECURITY_URL:-}
        DEPENDENCY_APT_UBUNTU_PORTS_URL: ${DEPENDENCY_APT_UBUNTU_PORTS_URL:-}
      additional_contexts:
        servicelib-source: ${SERVICELIB_SOURCE_CONTEXT:-https://github.com/gorundebug/cppboostservicelib.git#v0.2.34}
        module-inventory_service_api: ${MODULE_INVENTORY_SERVICE_API_SOURCE_CONTEXT:-https://github.com/gorundebug/cppboostexample.git#v0.2.34}
        module-model_cpp: ${MODULE_MODEL_CPP_SOURCE_CONTEXT:-https://github.com/gorundebug/cppboostexample.git#v0.2.34}
      secrets:
        - dependency_conan_credential
    extra_hosts:
      - "host.docker.internal:host-gateway"
    working_dir: /workspace/source
    environment:
      SERVICELIB_SOURCE_DIR: ${SERVICELIB_CONTAINER_SOURCE_DIR:-/opt/servicelib}
      CCACHE_DIR: /ccache
      CCACHE_BASEDIR: /workspace/source
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: ${CCACHE_MAXSIZE:-20G}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GIT_CONFIG_COUNT: ${GIT_CONFIG_COUNT:-0}
      GIT_CONFIG_KEY_0: ${GIT_CONFIG_KEY_0:-}
      GIT_CONFIG_VALUE_0: ${GIT_CONFIG_VALUE_0:-}
      GIT_CONFIG_KEY_1: ${GIT_CONFIG_KEY_1:-}
      GIT_CONFIG_VALUE_1: ${GIT_CONFIG_VALUE_1:-}
      FETCH_CPP_DEPENDENCIES: ${FETCH_CPP_DEPENDENCIES:-OFF}
      DEPENDENCY_CONAN_REMOTE_URL: ${DEPENDENCY_CONAN_REMOTE_URL:-}
      DEPENDENCY_CONAN_UPLOAD_URL: ${DEPENDENCY_CONAN_UPLOAD_URL:-}
      DEPENDENCY_CONAN_PUBLISH: ${DEPENDENCY_CONAN_PUBLISH:-0}
      CPPBOOSTSERVICELIB_CONAN_LOCKFILE: ${CPPBOOSTSERVICELIB_CONAN_LOCKFILE:-}
      DEPENDENCY_CONAN_CREDENTIAL_FILE: /run/secrets/dependency_conan_credential
      DEPENDENCY_GITHUB_RAW_URL: ${DEPENDENCY_GITHUB_RAW_URL:-}
      CONAN_HOME: /conan
    volumes:
      - cpp-cmake-build:/workspace/build
      - cpp-ccache:/ccache
      - ${DEPENDENCY_CONAN_HOME:-cpp-conan2}:/conan
    secrets:
      - dependency_conan_credential
    command:
      - /bin/bash
      - -c
      - source scripts/configure-git-auth.generated.sh && ./scripts/conan-install.generated.sh Debug /workspace/build/conan-debug && conan_toolchain="$$(cat /workspace/build/conan-debug/toolchain.path)" && cmake --fresh --preset docker-debug -DCMAKE_TOOLCHAIN_FILE="$$conan_toolchain" -DMODULES_ROOT=/workspace/modules -DFETCH_CPP_DEPENDENCIES=OFF && cmake --build --preset docker-debug --parallel && ctest --test-dir /workspace/build --output-on-failure --no-tests=error

  inventoryservice-runtime:
    image: cppboostexample-inventoryservice:local
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-inventoryservice
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        DEPENDENCY_DOCKER_REGISTRY: ${DEPENDENCY_DOCKER_REGISTRY:-docker.io}
        DEPENDENCY_GITHUB_RAW_URL: ${DEPENDENCY_GITHUB_RAW_URL:-}
        DEPENDENCY_APT_UBUNTU_ARCHIVE_URL: ${DEPENDENCY_APT_UBUNTU_ARCHIVE_URL:-}
        DEPENDENCY_APT_UBUNTU_SECURITY_URL: ${DEPENDENCY_APT_UBUNTU_SECURITY_URL:-}
        DEPENDENCY_APT_UBUNTU_PORTS_URL: ${DEPENDENCY_APT_UBUNTU_PORTS_URL:-}
        DEPENDENCY_CONAN_REMOTE_URL: ${DEPENDENCY_CONAN_REMOTE_URL:-}
        DEPENDENCY_CONAN_UPLOAD_URL: ${DEPENDENCY_CONAN_UPLOAD_URL:-}
        DEPENDENCY_CONAN_PUBLISH: ${DEPENDENCY_CONAN_PUBLISH:-0}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
        RUNTIME_STRIP: ${RUNTIME_STRIP:-ON}
        EXAMPLE_PROFILE: ${EXAMPLE_PROFILE:-function-call}
      additional_contexts:
        servicelib-source: ${SERVICELIB_SOURCE_CONTEXT:-https://github.com/gorundebug/cppboostservicelib.git#v0.2.34}
        module-inventory_service_api: ${MODULE_INVENTORY_SERVICE_API_SOURCE_CONTEXT:-https://github.com/gorundebug/cppboostexample.git#v0.2.34}
        module-model_cpp: ${MODULE_MODEL_CPP_SOURCE_CONTEXT:-https://github.com/gorundebug/cppboostexample.git#v0.2.34}
      secrets:
        - dependency_conan_credential

volumes:
  cpp-cmake-build:
    name: cppboostexample_inventoryservice_cpp-cmake-build
  cpp-ccache:
  cpp-conan2:
    name: dependency-conan2

secrets:
  dependency_conan_credential:
    file: ${DEPENDENCY_CONAN_CREDENTIAL_FILE:-/dev/null}