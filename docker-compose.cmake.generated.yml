services:
  cpp-build:
    image: cppboostexample-cpp-build
    build:
      context: .
      dockerfile: Dockerfile.cmake
      target: development
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        SERVICEGEN_GRPC_SOURCE_STAGE: grpc-source
        SERVICEGEN_ASIO_GRPC_SOURCE_STAGE: asio-grpc-source
        SERVICEGEN_GITHUB_RAW_URL: ${SERVICEGEN_GITHUB_RAW_URL:-}
        SERVICEGEN_APT_UBUNTU_ARCHIVE_URL: ${SERVICEGEN_APT_UBUNTU_ARCHIVE_URL:-}
        SERVICEGEN_APT_UBUNTU_SECURITY_URL: ${SERVICEGEN_APT_UBUNTU_SECURITY_URL:-}
        SERVICEGEN_APT_UBUNTU_PORTS_URL: ${SERVICEGEN_APT_UBUNTU_PORTS_URL:-}
      additional_contexts:
        servicelib-source: ${CPPBOOSTSERVICELIB_SOURCE_CONTEXT:-${SERVICELIB_SOURCE_CONTEXT:-https://github.com/gorundebug/cppboostservicelib.git#v0.2.10}}
        grpc-source: ${SERVICEGEN_GRPC_SOURCE_CONTEXT:-.}
        asio-grpc-source: ${SERVICEGEN_ASIO_GRPC_SOURCE_CONTEXT:-.}
    working_dir: /workspace
    environment:
      CPPBOOSTSERVICELIB_SOURCE_DIR: ${SERVICELIB_CONTAINER_SOURCE_DIR:-/opt/servicelib}
      SERVICELIB_SOURCE_DIR: ${SERVICELIB_CONTAINER_SOURCE_DIR:-/opt/servicelib}
      CCACHE_DIR: /ccache
      CCACHE_BASEDIR: /workspace
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: ${CCACHE_MAXSIZE:-20G}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      SERVICEGEN_FETCH_CPP_DEPENDENCIES: ${SERVICEGEN_FETCH_CPP_DEPENDENCIES:-OFF}
      SERVICEGEN_GITHUB_RAW_URL: ${SERVICEGEN_GITHUB_RAW_URL:-}
    volumes:
      - .:/workspace
      - cpp-cmake-build:/workspace/build
      - cpp-ccache:/ccache
    command:
      - /bin/bash
      - -lc
      - source scripts/configure-git-auth.generated.sh && cmake --preset docker-debug -DSERVICEGEN_FETCH_CPP_DEPENDENCIES="${SERVICEGEN_FETCH_CPP_DEPENDENCIES:-OFF}" && cmake --build --preset docker-debug --parallel && ctest --preset docker-debug
  analyticsservice-runtime:
    image: cppboostexample-analyticsservice
    build:
      context: .
      dockerfile: Dockerfile.cmake
      target: runtime-analyticsservice
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        SERVICEGEN_GRPC_SOURCE_STAGE: grpc-source
        SERVICEGEN_ASIO_GRPC_SOURCE_STAGE: asio-grpc-source
        SERVICEGEN_GITHUB_RAW_URL: ${SERVICEGEN_GITHUB_RAW_URL:-}
        SERVICEGEN_APT_UBUNTU_ARCHIVE_URL: ${SERVICEGEN_APT_UBUNTU_ARCHIVE_URL:-}
        SERVICEGEN_APT_UBUNTU_SECURITY_URL: ${SERVICEGEN_APT_UBUNTU_SECURITY_URL:-}
        SERVICEGEN_APT_UBUNTU_PORTS_URL: ${SERVICEGEN_APT_UBUNTU_PORTS_URL:-}
        CPPBOOSTSERVICELIB_PROFILING: ${CPPBOOSTSERVICELIB_PROFILING:-OFF}
        CPPBOOSTSERVICELIB_COROUTINE_DIAGNOSTICS: ${CPPBOOSTSERVICELIB_COROUTINE_DIAGNOSTICS:-OFF}
        SERVICEGEN_RUNTIME_STRIP: ${SERVICEGEN_RUNTIME_STRIP:-ON}
        SERVICEGEN_EXAMPLE_PROFILE: ${SERVICEGEN_EXAMPLE_PROFILE:-function-call}
      additional_contexts:
        servicelib-source: ${CPPBOOSTSERVICELIB_SOURCE_CONTEXT:-${SERVICELIB_SOURCE_CONTEXT:-https://github.com/gorundebug/cppboostservicelib.git#v0.2.10}}
        grpc-source: ${SERVICEGEN_GRPC_SOURCE_CONTEXT:-.}
        asio-grpc-source: ${SERVICEGEN_ASIO_GRPC_SOURCE_CONTEXT:-.}
  inventoryservice-runtime:
    image: cppboostexample-inventoryservice
    build:
      context: .
      dockerfile: Dockerfile.cmake
      target: runtime-inventoryservice
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        SERVICEGEN_GRPC_SOURCE_STAGE: grpc-source
        SERVICEGEN_ASIO_GRPC_SOURCE_STAGE: asio-grpc-source
        SERVICEGEN_GITHUB_RAW_URL: ${SERVICEGEN_GITHUB_RAW_URL:-}
        SERVICEGEN_APT_UBUNTU_ARCHIVE_URL: ${SERVICEGEN_APT_UBUNTU_ARCHIVE_URL:-}
        SERVICEGEN_APT_UBUNTU_SECURITY_URL: ${SERVICEGEN_APT_UBUNTU_SECURITY_URL:-}
        SERVICEGEN_APT_UBUNTU_PORTS_URL: ${SERVICEGEN_APT_UBUNTU_PORTS_URL:-}
        CPPBOOSTSERVICELIB_PROFILING: ${CPPBOOSTSERVICELIB_PROFILING:-OFF}
        CPPBOOSTSERVICELIB_COROUTINE_DIAGNOSTICS: ${CPPBOOSTSERVICELIB_COROUTINE_DIAGNOSTICS:-OFF}
        SERVICEGEN_RUNTIME_STRIP: ${SERVICEGEN_RUNTIME_STRIP:-ON}
        SERVICEGEN_EXAMPLE_PROFILE: ${SERVICEGEN_EXAMPLE_PROFILE:-function-call}
      additional_contexts:
        servicelib-source: ${CPPBOOSTSERVICELIB_SOURCE_CONTEXT:-${SERVICELIB_SOURCE_CONTEXT:-https://github.com/gorundebug/cppboostservicelib.git#v0.2.10}}
        grpc-source: ${SERVICEGEN_GRPC_SOURCE_CONTEXT:-.}
        asio-grpc-source: ${SERVICEGEN_ASIO_GRPC_SOURCE_CONTEXT:-.}
  orderservice-runtime:
    image: cppboostexample-orderservice
    build:
      context: .
      dockerfile: Dockerfile.cmake
      target: runtime-orderservice
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        SERVICEGEN_GRPC_SOURCE_STAGE: grpc-source
        SERVICEGEN_ASIO_GRPC_SOURCE_STAGE: asio-grpc-source
        SERVICEGEN_GITHUB_RAW_URL: ${SERVICEGEN_GITHUB_RAW_URL:-}
        SERVICEGEN_APT_UBUNTU_ARCHIVE_URL: ${SERVICEGEN_APT_UBUNTU_ARCHIVE_URL:-}
        SERVICEGEN_APT_UBUNTU_SECURITY_URL: ${SERVICEGEN_APT_UBUNTU_SECURITY_URL:-}
        SERVICEGEN_APT_UBUNTU_PORTS_URL: ${SERVICEGEN_APT_UBUNTU_PORTS_URL:-}
        CPPBOOSTSERVICELIB_PROFILING: ${CPPBOOSTSERVICELIB_PROFILING:-OFF}
        CPPBOOSTSERVICELIB_COROUTINE_DIAGNOSTICS: ${CPPBOOSTSERVICELIB_COROUTINE_DIAGNOSTICS:-OFF}
        SERVICEGEN_RUNTIME_STRIP: ${SERVICEGEN_RUNTIME_STRIP:-ON}
        SERVICEGEN_EXAMPLE_PROFILE: ${SERVICEGEN_EXAMPLE_PROFILE:-function-call}
      additional_contexts:
        servicelib-source: ${CPPBOOSTSERVICELIB_SOURCE_CONTEXT:-${SERVICELIB_SOURCE_CONTEXT:-https://github.com/gorundebug/cppboostservicelib.git#v0.2.10}}
        grpc-source: ${SERVICEGEN_GRPC_SOURCE_CONTEXT:-.}
        asio-grpc-source: ${SERVICEGEN_ASIO_GRPC_SOURCE_CONTEXT:-.}

volumes:
  cpp-cmake-build:
    name: ${SERVICEGEN_CPPBOOST_BUILD_VOLUME:-cppboostexample_cpp-cmake-build-v0.2.10}
  cpp-ccache:
    name: cppboostexample_cpp-ccache